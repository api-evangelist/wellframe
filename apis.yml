description: 'Wellframe is a digital health management and member engagement company, now part of HealthEdge,
  serving health plans and payers. Its platform combines care management, member engagement, and advocacy
  tooling to help health plans build trusted relationships with members through a mobile app and a clinician-facing
  dashboard. Wellframe does not publish a public developer API, developer portal, or SDKs; its integrations
  are delivered as part of enterprise health-plan implementations rather than a self-serve API program.'
